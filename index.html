<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PDF等工具箱合集</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,"Microsoft Yahei",sans-serif;
}
body{
  background:#edf2f7;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.page-header{
  padding:16px 16px 8px;
}
.page-header h1{
  font-size:22px;
  color:#1a202c;
  margin-bottom:6px;
}
.desc-tip{
  font-size:14px;
  color:#4a5568;
}
/* Tab容器，可横向滚动 */
.tab-scroll-wrap{
  padding:0 16px;
  overflow-x:auto;
  scrollbar-height:4px;
}
.tab-scroll-wrap::-webkit-scrollbar{
  height:4px;
}
.tab-scroll-wrap::-webkit-scrollbar-thumb{
  background:#cbd5e0;
  border-radius:2px;
}
.tab-bar{
  display:flex;
  gap:4px;
  border-bottom:1px solid #cbd5e0;
}
.tab-item{
  border:1px solid #cbd5e0;
  border-bottom:none;
  background:#e2e8f0;
  border-top-left-radius:8px;
  border-top-right-radius:8px;
  padding:10px 20px;
  cursor:pointer;
  font-size:15px;
  white-space:nowrap;
  transition:0.2s;
  margin-bottom:-1px;
}
.tab-item:hover{
  background:#cbd5e0;
}
.tab-item.active{
  background:#ffffff;
  color:#2b6cb0;
  font-weight:500;
}
/* iframe区域：移除左右padding */
.iframe-wrap{
  flex:1;
  padding:0 0 10px;
}
.iframe-panel{
  width:100%;
  height:100%;
  border:none;
  background:#fff;
}
/* 全局底部footer，所有tab共用 */
.footer{
  flex-shrink:0;
  padding:10px 16px 14px;
  border-top:1px solid #cbd5e0;
  text-align:center;
}
.footer a{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#6b7280;
  text-decoration:none;
}
.footer svg{
  fill:#6b7280;
}
.footer a:hover{
  color:#2563eb;
}
.footer a:hover svg{
  fill:#2563eb;
}
</style>
</head>
<body>
<div class="page-header">
  <h1>📄 PDF等工具箱合集</h1>
  <div class="desc-tip">全部文件在浏览器本地运算，不上传网络，保护你的文档隐私</div>
</div>

<div class="tab-scroll-wrap">
  <div class="tab-bar">
    <button class="tab-item active" data-src="01-pdf-split-tool-4.html">PDF分割</button>
    <button class="tab-item" data-src="02-pdf-merge-tool-3.html">PDF合并(支持图片)</button>
    <button class="tab-item" data-src="03-pdf-to-word-tool.html">PDF转Word</button>
    <button class="tab-item" data-src="04-pdf-compress-tool.html">PDF压缩瘦身</button>
    <button class="tab-item" data-src="05-pdf-remove-watermark-tool.html">PDF去水印</button>
    <button class="tab-item" data-src="06-id‑photo‑tool‑1.html">一寸证件照</button>
  </div>
</div>

<div class="iframe-wrap">
  <iframe id="toolIframe" class="iframe-panel" src="01-pdf-split-tool-4.html"></iframe>
</div>

<!-- 共用底部Github图标，只写一次，全部tab共享 -->
<div class="footer">
  <a href="https://github.com/andy0792" target="_blank" rel="noopener noreferrer">
    <svg height="20" width="20" viewBox="0 0 16 16">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
    </svg>
  </a>
</div>

<script>
const tabs=document.querySelectorAll(".tab-item");
const iframe=document.getElementById("toolIframe");
tabs.forEach(t=>{
  t.onclick=()=>{
    tabs.forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    iframe.src=t.dataset.src;
  }
})
</script>
</body>
</html>
